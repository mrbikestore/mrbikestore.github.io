<!doctype html>
<html lang="es" data-mode="client">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MRbikestore</title>
<meta name="description" content="Accesorios y Respuestos de bici">
<meta property="og:title" content="MRbikestore">
<meta property="og:description" content="Accesorios y Respuestos de bici">
<meta property="og:type" content="website">
<meta property="og:image" content="https://mrbikestore.github.io/logo.jpg">
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>body{margin:0;padding:0}img{max-width:100%}
/* Layout: shop window. Store name up top, filter row, product grid with shelf-label prices, cart bar pinned to the bottom. */
:root {
  --bg: #F3F4F7; --surface: #FFFFFF; --sunk: #E8EBF1; --ink: #14213D; --muted: #586379; --line: #DADFE8;
  --btn: #14213D; --btn-ink: #FFFFFF; --tag: #FFD23F; --tag-ink: #14213D;
  --ok: #1D7A4C; --ok-soft: #DCF1E5; --warn: #985A00; --warn-soft: #FCEFD4; --bad: #B3362E; --bad-soft: #FAE1DF;
  --band: #14213D; --band-ink: #F3F4F7;
  --f-display: "Gabarito", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C111D; --surface: #141B2C; --sunk: #1C2438; --ink: #E7EBF4; --muted: #97A1B7; --line: #252F47;
  --btn: #FFD23F; --btn-ink: #14213D; --ok: #55C68E; --ok-soft: #12331F; --warn: #E8B154; --warn-soft: #3A2A0E; --bad: #F0807A; --bad-soft: #3C1916;
  --band: #FFD23F; --band-ink: #14213D; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C111D; --surface: #141B2C; --sunk: #1C2438; --ink: #E7EBF4; --muted: #97A1B7; --line: #252F47;
  --btn: #FFD23F; --btn-ink: #14213D; --ok: #55C68E; --ok-soft: #12331F; --warn: #E8B154; --warn-soft: #3A2A0E; --bad: #F0807A; --bad-soft: #3C1916;
  --band: #FFD23F; --band-ink: #14213D; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.ownerbar { background: var(--band); color: var(--band-ink); }
.ownerbar .wrap { padding-block: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ownerbar .who { font-weight: 700; margin-right: auto; display: flex; flex-direction: column; line-height: 1.2; }
.ownerbar .who small { font-weight: 500; opacity: .8; }
.ownerbar .btn { background: transparent; color: var(--band-ink); border-color: currentColor; }
.ownerbar .btn.solid { background: var(--band-ink); color: var(--band); }

.hero { background: #010101; color: #fff; }
.hero .wrap { align-items: center; text-align: center; }
.hero .logo { width: min(300px, 74vw); height: auto; display: block; margin: -8px auto -4px; }
.hero p { color: #cbbfe6 !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hero .wrap { padding-block: 20px 18px; display: flex; flex-direction: column; gap: 6px; }
.hero h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }

.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.filters .wrap { padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); }
label.chk { display: flex; gap: 8px; align-items: center; font-weight: 600; }
label.chk input { width: auto; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.wa { background: #1FA855; color: #fff; border-color: #1FA855; }
.btn.big { width: 100%; padding: 14px; font-size: 1.05rem; }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }

main.wrap { padding-block: 8px 120px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.off { opacity: .55; }
.ph { aspect-ratio: 1; max-width: 100%; background: var(--sunk); position: relative; border: 0; padding: 0; cursor: pointer; display: block; width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 3rem; font-weight: 800; color: var(--muted); }
.ph .badge { position: absolute; left: 8px; top: 8px; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.body .n { font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.body .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.tag { background: var(--tag); color: var(--tag-ink); font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; padding: 2px 9px; border-radius: 4px; letter-spacing: -0.01em; box-shadow: inset 0 -2px 0 rgb(0 0 0 / .12); white-space: nowrap; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.neutral { background: var(--sunk); color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.qty button { border: 0; background: none; width: 32px; height: 32px; cursor: pointer; font-weight: 800; font-size: 1.05rem; }
.qty button:disabled { opacity: .3; cursor: not-allowed; }
.qty span { min-width: 22px; text-align: center; font-weight: 700; }
.add { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 10px; width: 34px; height: 34px; font-size: 1.3rem; font-weight: 800; cursor: pointer; }
.add:disabled { opacity: .35; cursor: not-allowed; }

.empty { text-align: center; padding: 56px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-size: 1.3rem; }

.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cartbar .btn { max-width: 560px; margin: 0 auto; display: flex; width: 100%; justify-content: space-between; padding: 14px 18px; font-size: 1.05rem; box-shadow: 0 8px 24px rgb(0 0 0 / .18); }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgb(8 12 22 / .5); display: flex; justify-content: center; align-items: flex-end; }
@media (min-width: 700px) { .overlay { align-items: center; padding: 24px; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .sheet { border-radius: 18px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.x { border: 0; background: var(--sunk); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; flex: none; }
.line { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line .thumb { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--sunk); }
.line .thumb img { width: 100%; height: 100%; object-fit: cover; }
.line .n { font-weight: 600; overflow-wrap: anywhere; }
.line .u { color: var(--muted); font-size: .85rem; }
.line .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.total { display: flex; justify-content: space-between; align-items: baseline; }
.total strong { font-family: var(--f-display); font-size: 1.8rem; font-weight: 800; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.formgrid .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .formgrid { grid-template-columns: 1fr; } }

.orderno { background: var(--tag); color: var(--tag-ink); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.orderno b { font-family: var(--f-display); font-size: 2rem; font-weight: 800; letter-spacing: .04em; }
.steps { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.steps li > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bank { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.bank div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.bank div:last-child { border-bottom: 0; }
.bank span { color: var(--muted); font-size: .85rem; }
.bank code { font-family: ui-monospace, Menlo, monospace; font-weight: 700; overflow-wrap: anywhere; text-align: right; user-select: all; }

.detail-img { width: 100%; max-width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--sunk); }
.photo-edit { display: flex; gap: 12px; align-items: center; }
.photo-edit .ph { width: 96px; flex: none; border-radius: 10px; overflow: hidden; cursor: default; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.notice { border-radius: 12px; padding: 10px 14px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.dots { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: .75rem; color: var(--muted); font-weight: 600; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c, #888); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .2); flex: none; display: inline-block; }
.dot.out { opacity: .3; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.sw { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.sw .dot { width: 22px; height: 22px; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.sw:disabled { cursor: not-allowed; color: var(--muted); text-decoration: line-through; }
.sw:disabled .dot { opacity: .35; }
.colrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 86px 34px; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.colrow input[type="color"] { width: 44px; height: 42px; padding: 3px; cursor: pointer; }
.colrow .cod { grid-column: 1 / 3; }
.colrow .cfoto { grid-column: 3 / 5; display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.colrow .cph { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; background: var(--sunk); flex: none; }
.colrow .cph img { width: 100%; height: 100%; object-fit: cover; display: block; }

.login { max-width: 520px; margin: 32px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.login ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.login code { background: var(--sunk); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
.err { color: var(--bad); font-weight: 600; margin: 0; }
.loading { text-align: center; padding: 56px 16px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: .4; } }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
'use strict';
/* ---------- Config ---------- */
const MODE = document.documentElement.dataset.mode === 'admin' ? 'admin' : 'client';
const OWNER = 'mrbikestore', REPO = 'mrbikestore.github.io', BRANCH = 'main';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const TOKEN_URL = 'https://github.com/settings/personal-access-tokens/new?name=Panel%20MRbikestore&description=Publicar%20el%20cat%C3%A1logo&target_name=mrbikestore&expires_in=366&contents=write';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const LOW = 3;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const money = n => '$ ' + num(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const store = (area, prefix) => ({
  get(k) { try { return JSON.parse(area.getItem(prefix + k)); } catch (e) { return null; } },
  set(k, v) { try { v == null ? area.removeItem(prefix + k) : area.setItem(prefix + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
});
const ss = (() => { try { return store(sessionStorage, 'cat:'); } catch (e) { return { get: () => null, set: () => false }; } })();
const ls = (() => { try { return store(localStorage, 'mbs:'); } catch (e) { return { get: () => null, set: () => false }; } })();
const imgSrc = f => !f ? '' : /^data:/.test(f) ? f : MODE === 'admin' ? RAW + f : f;
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- State ---------- */
const blankStore = { nombre: '', lema: '', whatsapp: '', alias: '', cbu: '', titular: '', banco: '', entrega: '' };
let D = { tienda: { ...blankStore }, productos: [], actualizado: null };
const setData = d => { D = { tienda: { ...blankStore, ...(d?.tienda || {}) }, productos: Array.isArray(d?.productos) ? d.productos : [], actualizado: d?.actualizado || null }; };
const UI = {
  q: '', cat: '', owner: false, asClient: false, dirty: false, sheet: null, loading: true, loadError: false,
  cart: ss.get('cart') || {}, order: ss.get('order') || null,
  form: ss.get('form') || { nombre: '', telefono: '', entrega: 'retiro', direccion: '', nota: '' },
};
const GH = { token: '', login: '', dataSha: null, seed: null };

const visible = () => D.productos.filter(p => p.visible !== false);
const byId = id => D.productos.find(p => p.id === id);
const unl = v => v == null || v === '';
const cols = p => Array.isArray(p?.colores) ? p.colores : [];
const hasCols = p => cols(p).length > 0;
const cHas = c => unl(c.stock) || num(c.stock) > 0;
const colorOf = (p, cid) => cols(p).find(c => c.id === cid);
const hasStock = p => hasCols(p) ? cols(p).some(cHas) : (unl(p.stock) || num(p.stock) > 0);
const maxQty = (p, c) => { const v = c ? c.stock : p.stock; return unl(v) ? 99 : Math.max(0, num(v)); };
const totalStock = p => hasCols(p) ? (cols(p).some(c => unl(c.stock)) ? null : cols(p).reduce((a, c) => a + num(c.stock), 0)) : (unl(p.stock) ? null : num(p.stock));
const keyOf = (pid, cid) => cid ? pid + '::' + cid : pid;
const splitKey = k => { const i = k.indexOf('::'); return i < 0 ? [k, ''] : [k.slice(0, i), k.slice(i + 2)]; };
const inCart = pid => Object.entries(UI.cart).reduce((a, [k, q]) => a + (splitKey(k)[0] === pid ? q : 0), 0);
const hex = v => /^#[0-9a-f]{6}$/i.test(String(v || '')) ? String(v) : '#888888';
const COLMAP = { 'negro': '#1a1a1a', 'blanco': '#ffffff', 'gris': '#9a9a9a', 'gris claro': '#cfcfcf', 'gris oscuro': '#555555', 'rojo': '#d32f2f', 'bordo': '#7b1e2b', 'rosa': '#f48fb1', 'rosado': '#f48fb1', 'fucsia': '#d81b60', 'violeta': '#7e57c2', 'lila': '#b39ddb', 'azul': '#1e4fd8', 'azul marino': '#1b2a4a', 'celeste': '#7cc4f0', 'turquesa': '#1fb5ad', 'verde': '#2e9d4a', 'verde agua': '#7fd6c2', 'verde oliva': '#6b7a2e', 'verde militar': '#4b5320', 'amarillo': '#f7d038', 'mostaza': '#d4a017', 'naranja': '#f28c28', 'coral': '#ff7f6b', 'marron': '#7a4b2a', 'chocolate': '#5a3420', 'camel': '#c19a6b', 'beige': '#e3d3b5', 'crema': '#f3ead3', 'natural': '#eadfca', 'nude': '#e0b9a0', 'dorado': '#c9a227', 'plateado': '#c0c4c8', 'cobre': '#b87333', 'transparente': '#eef3f6' };
const guessHex = name => { const n = norm(name); if (!n) return null; if (COLMAP[n]) return COLMAP[n]; const k = Object.keys(COLMAP).filter(k => n.startsWith(k + ' ')).sort((a, b) => b.length - a.length)[0]; return k ? COLMAP[k] : null; };
const dot = c => `<span class="dot" style="--c:${hex(c.hex)}"></span>`;
const dots = p => { const cs = cols(p); return `<span class="dots" aria-label="${cs.length} colores">${cs.slice(0, 7).map(c => `<span class="dot ${cHas(c) ? '' : 'out'}" style="--c:${hex(c.hex)}" title="${esc(c.nombre)}"></span>`).join('')}${cs.length > 7 ? `+${cs.length - 7}` : ''}</span>`; };
const showOwner = () => UI.owner && !UI.asClient;
const persist = () => { ss.set('cart', UI.cart); ss.set('order', UI.order); ss.set('form', UI.form); };

function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast'; t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);
}
function armed(btn) {
  if (btn.classList.contains('armed')) return true;
  const old = btn.textContent; btn.classList.add('armed'); btn.textContent = '¿Confirmar?';
  setTimeout(() => { btn.classList.remove('armed'); btn.textContent = old; }, 3000);
  return false;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch (e) {
    const el = btn?.closest('div')?.querySelector('code');
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('Seleccionado: mantené apretado para copiar');
  }
}

/* ---------- GitHub API (admin) ---------- */
async function gh(method, path, body, { allow404 = false, token = GH.token } = {}) {
  let r;
  try {
    r = await fetch(API + path, {
      method, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { const err = new Error('Sin conexión con GitHub. Revisá internet y probá de nuevo.'); err.status = 0; throw err; }
  if (r.status === 404 && allow404) return null;
  if (!r.ok) {
    const err = new Error('GitHub respondió ' + r.status); err.status = r.status;
    try { err.body = await r.json(); err.message += ': ' + (err.body.message || ''); } catch (e) {}
    throw err;
  }
  return r.status === 204 ? null : r.json();
}
const b64ToText = b => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, '')), ch => ch.charCodeAt(0)));
async function loadRemote() {
  const f = await gh('GET', `/contents/data.json?ref=${BRANCH}`, null, { allow404: true });
  if (!f) { GH.dataSha = null; return null; }
  GH.dataSha = f.sha;
  return JSON.parse(b64ToText(f.content));
}
function saveDraft() {
  if (!ls.set('draft', { base: GH.dataSha, data: D }) && !saveDraft.warned) { saveDraft.warned = true; toast('Hay demasiadas fotos nuevas para guardar el borrador. Publicá pronto.'); }
}
async function connect(token) {
  const repo = await gh('GET', '', null, { token });
  if (!repo?.permissions?.push) { const e = new Error('Esa clave no tiene permiso para escribir en el catálogo. Revisá que tenga "Contents: Read and write" sobre mrbikestore.github.io.'); e.status = 403; throw e; }
  GH.token = token;
  try { const u = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }); if (u.ok) GH.login = (await u.json()).login || ''; } catch (e) {}
}
/* ---------- Acceso con contraseña: la clave de GitHub viaja cifrada (AES-GCM + PBKDF2) en acceso.json ---------- */
const ITER = 600000;
const b64e = buf => { let s = ''; for (const b of new Uint8Array(buf)) s += String.fromCharCode(b); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealToken(token, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, ITER);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
  return { v: 1, iter: ITER, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct) };
}
async function openToken(box, pass) {
  const key = await deriveKey(pass, b64d(box.salt), box.iter || ITER);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(box.iv) }, key, b64d(box.ct));
  return new TextDecoder().decode(pt);
}
async function fetchAccess() {
  try { const r = await fetch('acceso.json?v=' + Date.now(), { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (j && j.ct) return j; } } catch (e) {}
  try { const r = await fetch(API + '/contents/acceso.json?ref=' + BRANCH, { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw+json' } }); if (r.ok) { const j = await r.json(); if (j && j.ct) return j; } } catch (e) {}
  return null;
}
const savedToken = () => ls.get('token') || ss.get('token');
const forgetToken = () => { ls.set('token', null); ss.set('token', null); GH.token = ''; };
async function adminBoot() {
  try { GH.seed = JSON.parse($('#seed')?.textContent || 'null'); } catch (e) { GH.seed = null; }
  const token = savedToken();
  if (!token) { GH.access = await fetchAccess(); UI.loading = false; renderLogin(); return; }
  try { await connect(token); }
  catch (e) { if (e.status === 401 || e.status === 403 || e.status === 404) { forgetToken(); GH.access = await fetchAccess(); renderLogin(e.status === 401 ? 'La sesión guardada venció. Volvé a entrar.' : e.message); return; } renderLogin(e.message); return; }
  fetchAccess().then(a => { GH.access = a; });
  await reloadFromGitHub(true);
}
async function reloadFromGitHub(useDraft) {
  UI.loading = true; UI.owner = true; render();
  try {
    const remote = await loadRemote();
    setData(remote || {});
    UI.dirty = false;
    const draft = useDraft ? ls.get('draft') : null;
    if (draft && draft.data) {
      if ((draft.base || null) === GH.dataSha && JSON.stringify(draft.data) !== JSON.stringify(D)) { setData(draft.data); UI.dirty = true; toast('Recuperé tus cambios sin publicar'); }
      else if ((draft.base || null) !== GH.dataSha) { ls.set('draft', null); }
    }
    if (!useDraft) ls.set('draft', null);
    UI.loading = false; UI.loadError = false;
  } catch (e) {
    console.error(e); UI.loading = false; UI.loadError = e.message;
  }
  render();
}
async function publish(btn) {
  if (!GH.token || UI.publishing) return;
  UI.publishing = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Publicando…'; }
  try {
    const ref = await gh('GET', `/git/ref/heads/${BRANCH}`);
    const head = ref.object.sha;
    const commit = await gh('GET', `/git/commits/${head}`);
    const cur = await gh('GET', `/contents/data.json?ref=${head}`, null, { allow404: true });
    if ((cur ? cur.sha : null) !== GH.dataSha) { const e = new Error('conflict'); e.code = 'conflict'; throw e; }
    const data = clone(D); data.actualizado = new Date().toISOString();
    const tree = [], used = new Set();
    const stamp = Date.now().toString(36);
    const putImg = async (o, name) => {
      if (o.foto && /^data:image\//.test(o.foto)) {
        const path = `img/${name}-${stamp}.jpg`;
        const blob = await gh('POST', '/git/blobs', { content: o.foto.split(',')[1], encoding: 'base64' });
        tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
        o.foto = path;
      }
      if (o.foto) used.add(o.foto);
    };
    for (const p of data.productos) {
      await putImg(p, p.id);
      for (const c of cols(p)) await putImg(c, p.id + '-' + c.id);
    }
    const full = await gh('GET', `/git/trees/${commit.tree.sha}?recursive=1`);
    for (const t of full.tree || []) if (t.type === 'blob' && t.path.startsWith('img/') && !used.has(t.path)) tree.push({ path: t.path, mode: '100644', type: 'blob', sha: null });
    tree.push({ path: 'data.json', mode: '100644', type: 'blob', content: JSON.stringify(data, null, 1) + '\n' });
    const nt = await gh('POST', '/git/trees', { base_tree: commit.tree.sha, tree });
    const nc = await gh('POST', '/git/commits', { message: `Catálogo actualizado${GH.login ? ' por ' + GH.login : ''}`, tree: nt.sha, parents: [head] });
    try { await gh('PATCH', `/git/refs/heads/${BRANCH}`, { sha: nc.sha, force: false }); }
    catch (e) { if (e.status === 422 || e.status === 409) { const c = new Error('conflict'); c.code = 'conflict'; throw c; } throw e; }
    const after = await gh('GET', `/contents/data.json?ref=${nc.sha}`, null, { allow404: true });
    GH.dataSha = after ? after.sha : null;
    setData(data); UI.dirty = false; ls.set('draft', null);
    toast('¡Publicado! Los clientes lo ven en 1 o 2 minutos');
  } catch (e) {
    console.error(e);
    if (e.code === 'conflict') { saveDraft(); openSheet('conflict'); }
    else if (e.status === 401) { toast('La clave venció o fue borrada. Volvé a conectarte.'); }
    else toast(e.message || 'No se pudo publicar. Probá de nuevo.');
  } finally {
    UI.publishing = false; render();
  }
}

function markDirty() { UI.dirty = true; saveDraft(); render(); }
function shrink(file, max = 900, q = 0.8) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Revisá la conexión.')); document.head.appendChild(s); });
}
async function importStock(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames.find(n => norm(n) === 'productos') || wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  if (!rows.length) throw new Error('El archivo no tiene filas.');
  const keys = Object.keys(rows[0]), find = names => keys.find(k => names.includes(norm(k)));
  const kN = find(['producto', 'nombre', 'descripcion', 'articulo']), kC = find(['codigo', 'cod', 'cod.', 'sku']), kS = find(['stock', 'cantidad', 'existencia']);
  if (!kN || !kS) throw new Error('No encontré las columnas “Producto” y “Stock”. Usá el archivo de Exportar a Excel de Mostrador.');
  const byCode = new Map(), byName = new Map();
  for (const r of rows) { const s = Math.max(0, Math.round(num(r[kS]))); if (kC && String(r[kC]).trim()) byCode.set(norm(r[kC]), s); byName.set(norm(r[kN]), s); }
  const res = { ok: 0, agotados: 0, sin: [] };
  for (const p of D.productos) {
    if (hasCols(p)) {
      for (const c of cols(p)) {
        const s = (c.codigo && byCode.has(norm(c.codigo))) ? byCode.get(norm(c.codigo)) : (byName.get(norm(p.nombre + ' ' + c.nombre)) ?? byName.get(norm(p.nombre + ' - ' + c.nombre)));
        if (s == null) { res.sin.push(`${p.nombre} (${c.nombre})`); continue; }
        c.stock = s; res.ok++; if (s <= 0) res.agotados++;
      }
      continue;
    }
    const s = (p.codigo && byCode.has(norm(p.codigo))) ? byCode.get(norm(p.codigo)) : byName.get(norm(p.nombre));
    if (s == null) { res.sin.push(p.nombre); continue; }
    p.stock = s; res.ok++; if (s <= 0) res.agotados++;
  }
  if (res.ok) markDirty();
  return res;
}

/* ---------- Events ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'bg' && ev.target !== el) return;
  switch (act) {
    case 'bg': case 'close': UI.photoDraft = undefined; UI.colorDraft = undefined; UI.prodForm = null; closeSheet(); break;
    case 'cat': UI.cat = el.dataset.v; renderCats(); renderGrid(); break;
    case 'inc': setQty(id, (UI.cart[id] || 0) + 1); break;
    case 'dec': setQty(id, (UI.cart[id] || 0) - 1); break;
    case 'inc-close': setQty(id, (UI.cart[id] || 0) + 1); closeSheet(); toast('Agregado al pedido'); break;
    case 'detail': UI.pick = null; openSheet('detail', id); break;
    case 'pick': UI.pick = el.dataset.v; renderSheet(); break;
    case 'open-cart': openSheet('cart'); break;
    case 'checkout': openSheet('checkout'); break;
    case 'copy': copy(el.dataset.v, el); break;
    case 'copy-msg': if (UI.order) { waLink(UI.order); copy(UI.waText, el); } break;
    case 'new-order': UI.order = null; persist(); closeSheet(); break;
    case 'reload': if (MODE === 'admin') reloadFromGitHub(true); else clientLoad(); break;
    /* owner */
    case 'store': openSheet('store'); break;
    case 'new': UI.photoDraft = undefined; UI.colorDraft = undefined; openSheet('prod', null); break;
    case 'edit': UI.photoDraft = undefined; UI.colorDraft = undefined; openSheet('prod', id); break;
    case 'photo-del': keepForm(); UI.photoDraft = ''; renderSheet(); break;
    case 'col-add': { keepForm(); const n = (UI.colorDraft ||= []).push({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nombre: '', hex: '#888888', stock: '', codigo: '', foto: '' }); renderSheet(); $(`#pf [data-ci="${n - 1}"][data-k="nombre"]`)?.focus(); break; }
    case 'col-del': keepForm(); UI.colorDraft.splice(+el.dataset.v, 1); renderSheet(); break;
    case 'col-foto-del': keepForm(); UI.colorDraft[+el.dataset.v].foto = ''; renderSheet(); break;
    case 'del': if (armed(el)) { D.productos = D.productos.filter(p => p.id !== id); for (const k of Object.keys(UI.cart)) if (splitKey(k)[0] === id) delete UI.cart[k]; UI.photoDraft = undefined; UI.colorDraft = undefined; closeSheet(); markDirty(); toast('Producto borrado. Acordate de publicar'); } break;
    case 'stock-import': openSheet('stockImport', null); break;
    case 'as-client': UI.asClient = true; render(); break;
    case 'as-owner': UI.asClient = false; render(); break;
    case 'publish': closeSheet(); await publish(el); break;
    case 'seed': if (GH.seed) { setData(GH.seed); markDirty(); toast('Catálogo traído. Revisalo y tocá “Publicar”'); } break;
    case 'reload-discard': closeSheet(); ls.set('draft', null); await reloadFromGitHub(false); break;
    case 'logout': if (UI.dirty && !armed(el)) break; forgetToken(); UI.owner = false; UI.tokenMode = false; renderLogin(); break;
    case 'access': openSheet('access'); break;
    case 'access-del': if (armed(el)) { try { const cur = await gh('GET', `/contents/acceso.json?ref=${BRANCH}`, null, { allow404: true }); if (cur) await gh('DELETE', '/contents/acceso.json', { message: 'Quitar acceso por contraseña', sha: cur.sha, branch: BRANCH }); GH.access = null; closeSheet(); toast('Acceso por contraseña quitado'); } catch (e) { toast(e.message); } } break;
    case 'token-mode': UI.tokenMode = true; renderLogin(); break;
    case 'pass-mode': UI.tokenMode = false; renderLogin(); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && UI.sheet) closeSheet(); });
window.addEventListener('beforeunload', ev => { if (MODE === 'admin' && UI.dirty) { ev.preventDefault(); ev.returnValue = ''; } });

/* ---------- Boot ---------- */
async function clientLoad() {
  UI.loading = true; UI.loadError = false; render();
  try {
    const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) setData({});
    else if (!r.ok) throw new Error('HTTP ' + r.status);
    else setData(await r.json());
  } catch (e) { console.error(e); UI.loadError = true; }
  UI.loading = false;
  if (UI.order && !UI.sheet) UI.sheet = 'order';
  render();
}
if (MODE === 'admin') { shell(); render(); adminBoot(); }
else { shell(); clientLoad(); }
})();
</script>
