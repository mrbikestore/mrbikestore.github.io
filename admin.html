<script>
(() => {
'use strict';
/* ---------- Config ---------- */
const MODE = document.documentElement.dataset.mode === 'admin' ? 'admin' : 'client';
const OWNER = 'mrbikestore', REPO = 'mrbikestore.github.io', BRANCH = 'main';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const TOKEN_URL = 'https://github.com/settings/personal-access-tokens/new?name=Panel%20MRbikestore&description=Publicar%20el%20cat%C3%A1logo&target_name=mrbikestore&expires_in=366&contents=write';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const LOW = 3;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const money = n => '$ ' + num(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const store = (area, prefix) => ({
  get(k) { try { return JSON.parse(area.getItem(prefix + k)); } catch (e) { return null; } },
  set(k, v) { try { v == null ? area.removeItem(prefix + k) : area.setItem(prefix + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
});
const ss = (() => { try { return store(sessionStorage, 'cat:'); } catch (e) { return { get: () => null, set: () => false }; } })();
const ls = (() => { try { return store(localStorage, 'mbs:'); } catch (e) { return { get: () => null, set: () => false }; } })();
const imgSrc = f => !f ? '' : /^data:/.test(f) ? f : MODE === 'admin' ? RAW + f : f;
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- State ---------- */
const blankStore = { nombre: '', lema: '', whatsapp: '', alias: '', cbu: '', titular: '', banco: '', entrega: '' };
let D = { tienda: { ...blankStore }, productos: [], actualizado: null };
const setData = d => { D = { tienda: { ...blankStore, ...(d?.tienda || {}) }, productos: Array.isArray(d?.productos) ? d.productos : [], actualizado: d?.actualizado || null }; };
const UI = {
  q: '', cat: '', owner: false, asClient: false, dirty: false, sheet: null, loading: true, loadError: false,
  cart: ss.get('cart') || {}, order: ss.get('order') || null,
  form: ss.get('form') || { nombre: '', telefono: '', entrega: 'retiro', direccion: '', nota: '' },
};
const GH = { token: '', login: '', dataSha: null, seed: null };

const visible = () => D.productos.filter(p => p.visible !== false);
const byId = id => D.productos.find(p => p.id === id);
const unl = v => v == null || v === '';
const cols = p => Array.isArray(p?.colores) ? p.colores : [];
const hasCols = p => cols(p).length > 0;
const cHas = c => unl(c.stock) || num(c.stock) > 0;
const colorOf = (p, cid) => cols(p).find(c => c.id === cid);
const hasStock = p => hasCols(p) ? cols(p).some(cHas) : (unl(p.stock) || num(p.stock) > 0);
const maxQty = (p, c) => { const v = c ? c.stock : p.stock; return unl(v) ? 99 : Math.max(0, num(v)); };
const totalStock = p => hasCols(p) ? (cols(p).some(c => unl(c.stock)) ? null : cols(p).reduce((a, c) => a + num(c.stock), 0)) : (unl(p.stock) ? null : num(p.stock));
const keyOf = (pid, cid) => cid ? pid + '::' + cid : pid;
const splitKey = k => { const i = k.indexOf('::'); return i < 0 ? [k, ''] : [k.slice(0, i), k.slice(i + 2)]; };

/* ---------- GitHub API (admin) ---------- */
async function gh(method, path, body, { allow404 = false, token = GH.token } = {}) {
  let r;
  try {
    r = await fetch(API + path, {
      method, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { const err = new Error('Sin conexión con GitHub. Revisá internet y probá de nuevo.'); err.status = 0; throw err; }
  if (r.status === 404 && allow404) return null;
  if (!r.ok) {
    const err = new Error('GitHub respondió ' + r.status); err.status = r.status;
    try { err.body = await r.json(); err.message += ': ' + (err.body.message || ''); } catch (e) {}
    throw err;
  }
  return r.status === 204 ? null : r.json();
}
const b64ToText = b => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, '')), ch => ch.charCodeAt(0)));
async function loadRemote() {
  const f = await gh('GET', `/contents/data.json?ref=${BRANCH}`, null, { allow404: true });
  if (!f) { GH.dataSha = null; return null; }
  GH.dataSha = f.sha;
  return JSON.parse(b64ToText(f.content));
}
function saveDraft() {
  if (!ls.set('draft', { base: GH.dataSha, data: D }) && !saveDraft.warned) { saveDraft.warned = true; toast('Hay demasiadas fotos nuevas para guardar el borrador. Publicá pronto.'); }
}
async function connect(token) {
  const repo = await gh('GET', '', null, { token });
  if (!repo?.permissions?.push) { const e = new Error('Esa clave no tiene permiso para escribir en el catálogo. Revisá que tenga "Contents: Read and write" sobre mrbikestore.github.io.'); e.status = 403; throw e; }
  GH.token = token;
  try { const u = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }); if (u.ok) GH.login = (await u.json()).login || ''; } catch (e) {}
}
async function adminBoot() {
  try { GH.seed = JSON.parse($('#seed')?.textContent || 'null'); } catch (e) { GH.seed = null; }
  const token = ls.get('token');
  if (!token) { UI.loading = false; renderLogin(); return; }
  try { await connect(token); }
  catch (e) { if (e.status === 401 || e.status === 403 || e.status === 404) { ls.set('token', null); renderLogin(e.status === 401 ? 'La clave guardada venció o fue borrada. Creá una nueva.' : e.message); return; } renderLogin(e.message); return; }
  await reloadFromGitHub(true);
}
async function reloadFromGitHub(useDraft) {
  UI.loading = true; UI.owner = true; render();
  try {
    const remote = await loadRemote();
    setData(remote || {});
    UI.dirty = false;
    const draft = useDraft ? ls.get('draft') : null;
    if (draft && draft.data) {
      if ((draft.base || null) === GH.dataSha && JSON.stringify(draft.data) !== JSON.stringify(D)) { setData(draft.data); UI.dirty = true; toast('Recuperé tus cambios sin publicar'); }
      else if ((draft.base || null) !== GH.dataSha) { ls.set('draft', null); }
    }
    if (!useDraft) ls.set('draft', null);
    UI.loading = false; UI.loadError = false;
  } catch (e) {
    console.error(e); UI.loading = false; UI.loadError = e.message;
  }
  render();
}
async function publish(btn) {
  if (!GH.token || UI.publishing) return;
  UI.publishing = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Publicando…'; }
  try {
    const ref = await gh('GET', `/git/ref/heads/${BRANCH}`);
    const head = ref.object.sha;
    const commit = await gh('GET', `/git/commits/${head}`);
    const cur = await gh('GET', `/contents/data.json?ref=${head}`, null, { allow404: true });
    if ((cur ? cur.sha : null) !== GH.dataSha) { const e = new Error('conflict'); e.code = 'conflict'; throw e; }
    const data = clone(D); data.actualizado = new Date().toISOString();
    const tree = [], used = new Set();
    const stamp = Date.now().toString(36);
    const putImg = async (o, name) => {
      if (o.foto && /^data:image\//.test(o.foto)) {
        const path = `img/${name}-${stamp}.jpg`;
        const blob = await gh('POST', '/git/blobs', { content: o.foto.split(',')[1], encoding: 'base64' });
        tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
        o.foto = path;
      }
      if (o.foto) used.add(o.foto);
    };
    for (const p of data.productos) {
      await putImg(p, p.id);
      for (const c of cols(p)) await putImg(c, p.id + '-' + c.id);
    }
    const full = await gh('GET', `/git/trees/${commit.tree.sha}?recursive=1`);
    for (const t of full.tree || []) if (t.type === 'blob' && t.path.startsWith('img/') && !used.has(t.path)) tree.push({ path: t.path, mode: '100644', type: 'blob', sha: null });
    tree.push({ path: 'data.json', mode: '100644', type: 'blob', content: JSON.stringify(data, null, 1) + '\n' });
    const nt = await gh('POST', '/git/trees', { base_tree: commit.tree.sha, tree });
    const nc = await gh('POST', '/git/commits', { message: `Catálogo actualizado${GH.login ? ' por ' + GH.login : ''}`, tree: nt.sha, parents: [head] });
    try { await gh('PATCH', `/git/refs/heads/${BRANCH}`, { sha: nc.sha, force: false }); }
    catch (e) { if (e.status === 422 || e.status === 409) { const c = new Error('conflict'); c.code = 'conflict'; throw c; } throw e; }
    const after = await gh('GET', `/contents/data.json?ref=${nc.sha}`, null, { allow404: true });
    GH.dataSha = after ? after.sha : null;
    setData(data); UI.dirty = false; ls.set('draft', null);
    toast('¡Publicado! Los clientes lo ven en 1 o 2 minutos');
  } catch (e) {
    console.error(e);
    if (e.code === 'conflict') { saveDraft(); openSheet('conflict'); }
    else if (e.status === 401) { toast('La clave venció o fue borrada. Volvé a conectarte.'); }
    else toast(e.message || 'No se pudo publicar. Probá de nuevo.');
  } finally {
    UI.publishing = false; render();
  }
}

/* ---------- Owner tools ---------- */
function markDirty() { UI.dirty = true; saveDraft(); render(); }
function shrink(file, max = 900, q = 0.8) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Revisá la conexión.')); document.head.appendChild(s); });
}
async function importStock(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames.find(n => norm(n) === 'productos') || wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  if (!rows.length) throw new Error('El archivo no tiene filas.');
  const keys = Object.keys(rows[0]), find = names => keys.find(k => names.includes(norm(k)));
  const kN = find(['producto', 'nombre', 'descripcion', 'articulo']), kC = find(['codigo', 'cod', 'cod.', 'sku']), kS = find(['stock', 'cantidad', 'existencia']);
  if (!kN || !kS) throw new Error('No encontré las columnas “Producto” y “Stock”. Usá el archivo de Exportar a Excel de Mostrador.');
  const byCode = new Map(), byName = new Map();
  for (const r of rows) { const s = Math.max(0, Math.round(num(r[kS]))); if (kC && String(r[kC]).trim()) byCode.set(norm(r[kC]), s); byName.set(norm(r[kN]), s); }
  const res = { ok: 0, agotados: 0, sin: [] };
  for (const p of D.productos) {
    if (hasCols(p)) {
      for (const c of cols(p)) {
        const s = (c.codigo && byCode.has(norm(c.codigo))) ? byCode.get(norm(c.codigo)) : (byName.get(norm(p.nombre + ' ' + c.nombre)) ?? byName.get(norm(p.nombre + ' - ' + c.nombre)));
        if (s == null) { res.sin.push(`${p.nombre} (${c.nombre})`); continue; }
        c.stock = s; res.ok++; if (s <= 0) res.agotados++;
      }
      continue;
    }
    const s = (p.codigo && byCode.has(norm(p.codigo))) ? byCode.get(norm(p.codigo)) : byName.get(norm(p.nombre));
    if (s == null) { res.sin.push(p.nombre); continue; }
    p.stock = s; res.ok++; if (s <= 0) res.agotados++;
  }
  if (res.ok) markDirty();
  return res;
}

    case 'detail': UI.pick = null; openSheet('detail', id); break;
    case 'pick': UI.pick = el.dataset.v; renderSheet(); break;
    case 'open-cart': openSheet('cart'); break;
    case 'checkout': openSheet('checkout'); break;
    case 'copy': copy(el.dataset.v, el); break;
    case 'copy-msg': if (UI.order) { waLink(UI.order); copy(UI.waText, el); } break;
    case 'new-order': UI.order = null; persist(); closeSheet(); break;
    case 'reload': if (MODE === 'admin') reloadFromGitHub(true); else clientLoad(); break;
    /* owner */
    case 'store': openSheet('store'); break;
    case 'new': UI.photoDraft = undefined; UI.colorDraft = undefined; openSheet('prod', null); break;
    case 'edit': UI.photoDraft = undefined; UI.colorDraft = undefined; openSheet('prod', id); break;
    case 'photo-del': keepForm(); UI.photoDraft = ''; renderSheet(); break;
    case 'col-add': { keepForm(); const n = (UI.colorDraft ||= []).push({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nombre: '', hex: '#888888', stock: '', codigo: '', foto: '' }); renderSheet(); $(`#pf [data-ci="${n - 1}"][data-k="nombre"]`)?.focus(); break; }
    case 'col-del': keepForm(); UI.colorDraft.splice(+el.dataset.v, 1); renderSheet(); break;
    case 'col-foto-del': keepForm(); UI.colorDraft[+el.dataset.v].foto = ''; renderSheet(); break;
    case 'del': if (armed(el)) { D.productos = D.productos.filter(p => p.id !== id); for (const k of Object.keys(UI.cart)) if (splitKey(k)[0] === id) delete UI.cart[k]; UI.photoDraft = undefined; UI.colorDraft = undefined; closeSheet(); markDirty(); toast('Producto borrado. Acordate de publicar'); } break;
    case 'stock-import': openSheet('stockImport', null); break;
    case 'as-client': UI.asClient = true; render(); break;
    case 'as-owner': UI.asClient = false; render(); break;
    case 'publish': closeSheet(); await publish(el); break;
    case 'seed': if (GH.seed) { setData(GH.seed); markDirty(); toast('Catálogo traído. Revisalo y tocá “Publicar”'); } break;
    case 'reload-discard': closeSheet(); ls.set('draft', null); await reloadFromGitHub(false); break;
    case 'logout': if (UI.dirty && !armed(el)) break; ls.set('token', null); GH.token = ''; UI.owner = false; renderLogin(); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && UI.sheet) closeSheet(); });
window.addEventListener('beforeunload', ev => { if (MODE === 'admin' && UI.dirty) { ev.preventDefault(); ev.returnValue = ''; } });

/* ---------- Boot ---------- */
async function clientLoad() {
  UI.loading = true; UI.loadError = false; render();
  try {
    const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) setData({});
    else if (!r.ok) throw new Error('HTTP ' + r.status);
    else setData(await r.json());
  } catch (e) { console.error(e); UI.loadError = true; }
  UI.loading = false;
  if (UI.order && !UI.sheet) UI.sheet = 'order';
  render();
}
if (MODE === 'admin') { shell(); render(); adminBoot(); }
else { shell(); clientLoad(); }
})();
</script>
</body>
</html>
